<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="ch-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" ry="16" fill="url(#ch-grad)" filter="url(#ch-shadow)" />
  
  <!-- Subtle Inner Ring Highlight -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" ry="14.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />
  
  <!-- CH Monogram Lettering -->
  <text x="31" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CH</text>
  
  <!-- Golden Sparkle Accent Dot (Top-Right) -->
  <circle cx="48" cy="16" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
</svg>